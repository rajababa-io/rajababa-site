<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Noovo Next — control screen prototype</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --y: #fcb018; --y-soft: #fff4d6; --ink: #161616; --mute: #77726d; --line: #eee9e3;
    --bg: #f3efea; --card: #fff; --soft: #f8f6f4; --blue: #3f8fe0; --heat: #f08a24; --green: #2f9a55;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #e9dfd2 url(wood.png) center / cover; font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); overflow: hidden; letter-spacing: -0.01em; }
  button { font-family: inherit; letter-spacing: inherit; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1936px; height: 960px; }
  #viewsw { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 60; display: flex; gap: 4px; background: rgba(255,255,255,.85); backdrop-filter: blur(6px); border-radius: 16px; padding: 4px; box-shadow: 0 2px 10px rgba(80,60,40,.15); }
  #viewsw button { border: 0; background: none; border-radius: 12px; padding: 9px 16px; font-size: 14px; color: var(--mute); cursor: pointer; }
  #viewsw button.on { background: var(--y); color: var(--ink); font-weight: 600; }
  body.phonemode #viewsw { display: none; }
  body.v-garmin #phonedev, body.v-garmin .cap.pc { display: none; }
  body.v-phone #tablet, body.v-phone .cap.tc { display: none; }
  body.v-phone #phonedev { left: 0; } body.v-phone .cap.pc { left: 0 !important; }
  #tablet { position: absolute; left: 0; top: 0; width: 1436px; height: 908px; }
  .cap { position: absolute; top: 926px; text-align: center; font-size: 17px; color: #6b5d4c; letter-spacing: .01em; }
  /* phone: iPhone-sized handset beside the tablet on wide screens; the whole viewport on a phone */
  #phonedev { position: absolute; left: 1506px; top: 12px; width: 430px; height: 884px; border-radius: 64px; background: #1b1b1d;
    box-shadow: inset 0 0 0 2px #3a3a3d, 0 22px 30px rgba(70,50,30,.35), 0 3px 6px rgba(0,0,0,.35); }
  #phonedev .island { position: absolute; left: 50%; top: 32px; width: 118px; height: 34px; margin-left: -59px; border-radius: 20px; background: #000; z-index: 5; }
  #phone { position: absolute; left: 20px; top: 20px; width: 390px; height: 844px; border-radius: 46px; overflow-y: auto; background: var(--bg); padding: 70px 16px 28px; }
  #phone::-webkit-scrollbar { width: 0; }
  #ptoast { position: absolute; left: 36px; right: 36px; bottom: 50px; background: #1f1f1f; color: #fff; padding: 11px 14px; border-radius: 14px; font-size: 14px; opacity: 0; transform: translateY(14px); transition: all .3s; z-index: 6; pointer-events: none; }
  #ptoast.show { opacity: 1; transform: none; }
  body.phonemode #stage { left: 0; top: 0; width: 100%; height: 100%; transform: none !important; }
  body.phonemode #tablet, body.phonemode .cap { display: none; }
  body.phonemode #phonedev { position: fixed; inset: 0; width: auto; height: auto; border-radius: 0; background: var(--bg); box-shadow: none; }
  body.phonemode #phonedev .island { display: none; }
  body.phonemode #phone { position: absolute; inset: 0; width: auto; height: auto; border-radius: 0; padding: max(18px, env(safe-area-inset-top)) 16px 28px; }
  body.phonemode #ptoast { position: fixed; bottom: 24px; left: 16px; right: 16px; }
  .ph-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .ph-hi { font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
  .ph-conn { font-size: 12.5px; color: #2f7d4a; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .ph-conn i { width: 7px; height: 7px; border-radius: 50%; background: #2f9a55; box-shadow: 0 0 0 3px rgba(47,154,85,.18); }
  .ph-conn.off { color: #a3530e; } .ph-conn.off i { background: #e0533d; box-shadow: 0 0 0 3px rgba(224,83,61,.18); }
  .ph-hero { position: relative; height: 170px; border-radius: 22px; background: #f4f1ea; overflow: hidden; margin-bottom: 10px; }
  .ph-hero img { position: absolute; left: 50%; top: 58%; width: min(330px, 88%); transform: translate(-50%, -50%); transition: opacity .5s; }
  .ph-wx { position: absolute; left: 12px; top: 10px; background: rgba(255,255,255,.88); border-radius: 12px; padding: 6px 10px; font-size: 12.5px; color: var(--mute); z-index: 2; }
  .ph-wx b { color: var(--ink); font-size: 16px; font-weight: 500; margin-right: 4px; }
  .ph-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ph-tile { background: #fff; border-radius: 18px; padding: 12px 14px; }
  .ph-tile .h { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--mute); }
  .ph-tile .v { font-size: 26px; letter-spacing: -.03em; margin-top: 6px; line-height: 1.05; }
  .ph-tile .v small { font-size: 13px; color: var(--mute); letter-spacing: 0; }
  .ph-tile .s { font-size: 12.5px; color: var(--mute); margin-top: 3px; }
  .ph-sec { font-size: 13px; color: var(--mute); margin: 18px 4px 8px; display: flex; }
  .ph-sec span { margin-left: auto; }
  .ph-scn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ph-scn button { border: 0; border-radius: 18px; background: #fff; padding: 14px; text-align: left; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; color: var(--ink); }
  .ph-scn button b { display: block; font-size: 12px; font-weight: 400; color: var(--mute); margin-top: 3px; }
  .ph-scn button.active { background: var(--y); } .ph-scn button.active b { color: var(--ink); opacity: .7; }
  .ph-card { background: #fff; border-radius: 18px; padding: 4px 14px; }
  .ph-card .row { min-height: 56px; }
  .ph-card .row .lbl { font-size: 15.5px; }
  .ph-tgt { display: flex; align-items: center; gap: 10px; padding: 12px 0 10px; }
  .ph-tgt .t { flex: 1; } .ph-tgt .t b { font-size: 30px; font-weight: 400; letter-spacing: -.03em; } .ph-tgt .t small { display: block; font-size: 12.5px; color: var(--mute); }
  .ph-tgt button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--soft); font-size: 22px; cursor: pointer; }
  .ph-off { background: #fdebd9; color: #8a4510; border-radius: 16px; padding: 12px 14px; font-size: 13.5px; line-height: 1.4; margin-top: 12px; }
  .ph-off button { border: 0; background: #fff; border-radius: 10px; padding: 7px 10px; margin-top: 8px; font-size: 13px; cursor: pointer; }
  .ph-menu, .ph-back { margin-left: auto; width: 42px; height: 42px; border-radius: 50%; border: 0; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .ph-menu svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; }
  .ph-back { margin-left: 0; font-size: 28px; line-height: 1; padding-bottom: 4px; color: var(--ink); }
  .ph-page, .ph-page > div { display: flex; flex-direction: column; gap: 10px; }
  .ph-page .card { padding: 14px 14px; border-radius: 18px; }
  .ph-page .ring { width: 120px; height: 120px; } .ph-page .ring .mid .t { font-size: 30px; }
  .ph-page .ringwrap { gap: 12px; } .ph-page .tgt button { width: 40px; height: 40px; } .ph-page .tgt .v { font-size: 22px; min-width: 48px; }
  .ph-page .seg button { font-size: 13.5px; padding: 9px 4px; }
  #phone .i, #phone .pen, #phone .scene.add { display: none; }
  .ph-sheetbg { position: absolute; inset: 0; background: rgba(20,20,20,.35); z-index: 8; }
  body.phonemode .ph-sheetbg, body.phonemode .ph-sheet { position: fixed; }
  .ph-sheet { position: absolute; left: 10px; right: 10px; bottom: 10px; background: #fff; border-radius: 26px; padding: 8px 10px 12px; z-index: 9; box-shadow: 0 -6px 30px rgba(0,0,0,.18); animation: up .25s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .ph-sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: #ddd6ce; margin: 2px auto 8px; }
  .ph-sheet button { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 9px 8px; border-radius: 14px; text-align: left; font-size: 16px; cursor: pointer; font-family: inherit; color: var(--ink); }
  .ph-sheet button.on { background: var(--y-soft); }
  .ph-sheet button small { display: block; font-size: 12.5px; color: var(--mute); margin-top: 1px; }
  .ph-sheet .gl { width: 38px; height: 38px; border-radius: 50%; background: var(--soft); display: flex; align-items: center; justify-content: center; flex: none; }
  .ph-sheet button.on .gl { background: var(--y); }
  .ph-sheet .gl svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ph-foot { font-size: 12px; color: #a49d95; text-align: center; margin-top: 16px; }

  /* Garmin 10" display: graphite metal frame with clipped corners, black glass, GARMIN printed on the left glass border */
  #device { position: absolute; inset: 0; filter: drop-shadow(0 22px 26px rgba(70,50,30,.35)) drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
  #bezel { position: absolute; inset: 0; background: linear-gradient(160deg, #4a4a4d 0%, #2f2f31 45%, #3b3b3e 100%);
    clip-path: polygon(30px 0, calc(100% - 30px) 0, 100% 30px, 100% calc(100% - 30px), calc(100% - 30px) 100%, 30px 100%, 0 calc(100% - 30px), 0 30px); }
  #bezel::after { content: ""; position: absolute; inset: 2px; clip-path: inherit; box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
  #glass { position: absolute; left: 34px; top: 34px; right: 34px; bottom: 34px; background: #0b0b0c; border-radius: 10px; box-shadow: 0 0 0 1px #1c1c1e, inset 0 0 0 1px #2a2a2c; }
  .brand { position: absolute; left: 50px; top: 120px; color: #cfcfd2; font: 700 19px/1 Arial, Helvetica, sans-serif; letter-spacing: .06em; writing-mode: vertical-rl; opacity: .9; }
  .sheen { position: absolute; left: 34px; top: 34px; right: 34px; bottom: 34px; border-radius: 10px; pointer-events: none; z-index: 50;
    background: linear-gradient(115deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 28%, rgba(255,255,255,0) 70%, rgba(255,255,255,.04) 100%); }
  #frame { position: absolute; left: 104px; top: 54px; width: 1280px; height: 800px; background: var(--bg); border-radius: 4px; overflow: hidden; display: grid; grid-template-columns: 104px 1fr; grid-template-rows: 66px 1fr; }

  /* top bar */
  #top { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 0 22px 0 26px; }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 500; font-size: 23px; letter-spacing: -0.02em; }
  .hello { color: var(--mute); font-size: 14px; margin-left: 10px; margin-right: auto; }
  .chip { background: #fff; border-radius: 22px; padding: 8px 15px; font-size: 14px; color: var(--mute); }
  .chip b { color: var(--ink); font-weight: 600; }
  .tag { font-size: 10.5px; letter-spacing: .08em; color: var(--mute); border: 1px solid #d9d3cc; border-radius: 6px; padding: 3px 6px; margin-left: 4px; }

  /* nav rail — circles, as in the Noovo app */
  #rail { padding: 6px 0 16px 20px; }
  #nav { background: #fff; border-radius: 44px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 72px; }
  .nav { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 4px 0; color: #4a4744; }
  .nav .c { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background .2s; }
  .nav svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .nav span { font-size: 10.5px; color: var(--mute); }
  .nav.on .c { background: var(--y); color: var(--ink); }
  .nav.on span { color: var(--ink); font-weight: 600; }

  #main { display: grid; grid-template-columns: 1fr 440px; gap: 14px; padding: 6px 18px 16px 14px; min-height: 0; }
  .hero { background: #fff; border-radius: 26px; position: relative; overflow: hidden; transition: background .4s; }
  .hero.outside { background: #f4f1ea; }
  .lightlayer { position: absolute; inset: 0; pointer-events: none; -webkit-mask: url(cutaway.png) center / contain no-repeat; mask: url(cutaway.png) center / contain no-repeat; }
  #panel { overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 6px; }
  #panel::-webkit-scrollbar { width: 0; }

  /* hero stage */
  .scene3d { position: absolute; left: 50%; top: 47%; width: 660px; height: 660px; transform: translate(-50%, -50%); }
  .scene3d img.base { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .5s; user-select: none; -webkit-user-drag: none; }
  .fx { position: absolute; inset: 0; pointer-events: none; transition: opacity .8s; }
  .floorheat { -webkit-mask: url(floormask.png) center / contain no-repeat; mask: url(floormask.png) center / contain no-repeat;
    background: repeating-linear-gradient(115deg, rgba(240,120,30,.0) 0 14px, rgba(240,120,30,.35) 14px 20px, rgba(240,120,30,0) 22px 36px);
    background-size: 200% 200%; animation: heatflow 3s linear infinite; mix-blend-mode: multiply; }
  .floorwash { -webkit-mask: url(floormask.png) center / contain no-repeat; mask: url(floormask.png) center / contain no-repeat; background: rgba(250,140,50,.45); mix-blend-mode: multiply; animation: breathe 2.6s ease-in-out infinite; }
  .airwash { -webkit-mask: url(cutaway.png) center / contain no-repeat; mask: url(cutaway.png) center / contain no-repeat; background-size: 100% 300%; animation: sweep 3.2s linear infinite; }
  @keyframes sweep { from { background-position: 0 0; } to { background-position: 0 100%; } }
  @keyframes heatflow { to { background-position: 72px 0; } }
  @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .halo { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255,214,110,.75) 0%, rgba(255,200,80,.35) 35%, rgba(255,200,80,0) 70%); mix-blend-mode: multiply; transition: opacity .4s, width .3s, height .3s; }
  .pin { position: absolute; transform: translate(-50%, -50%); width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,.95); box-shadow: 0 2px 10px rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #6d6863; transition: background .2s, transform .15s; }
  .pin:active { transform: translate(-50%, -50%) scale(.92); }
  .pin svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .pin.on { background: var(--y); color: var(--ink); box-shadow: 0 0 0 6px rgba(252,176,24,.25), 0 2px 10px rgba(0,0,0,.18); }
  .pin .spin { animation: spin 1.2s linear infinite; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .callout { position: absolute; transform: translate(-50%, -50%); background: rgba(255,255,255,.96); border-radius: 14px; padding: 7px 11px; box-shadow: 0 3px 14px rgba(0,0,0,.14); font-size: 12.5px; line-height: 1.25; white-space: nowrap; cursor: pointer; }
  .callout b { display: block; font-size: 13.5px; font-weight: 600; }
  .callout .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .climatechip { position: absolute; left: 20px; top: 18px; display: flex; align-items: center; gap: 9px; background: var(--soft); border-radius: 18px; padding: 9px 14px; font-size: 14px; }
  .climatechip .arrows { display: inline-flex; flex-direction: column; line-height: 6px; font-size: 13px; }
  .climatechip .arrows i { font-style: normal; animation: rise 1.2s infinite; }
  .climatechip .arrows i:nth-child(2) { animation-delay: .2s; }
  .climatechip.cool .arrows i { animation-name: fall; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(4px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateY(-4px); } }
  @keyframes fall { 0% { opacity: 0; transform: translateY(-4px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateY(4px); } }
  .viewsw { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 4px; background: var(--soft); border-radius: 18px; padding: 5px; }
  .viewsw button { white-space: nowrap; border: 0; background: none; border-radius: 14px; padding: 10px 20px; font-size: 14.5px; color: var(--mute); cursor: pointer; }
  .viewsw button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .heronote { position: absolute; right: 20px; top: 22px; font-size: 12px; color: var(--mute); }

  /* cards */
  .card { background: var(--card); border-radius: 22px; padding: 16px 18px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; font-weight: 500; color: var(--mute); display: flex; align-items: center; gap: 6px; }
  .card h3 .r { margin-left: auto; }
  .big { font-size: 30px; font-weight: 400; letter-spacing: -0.03em; line-height: 1.1; }
  .sub { font-size: 14px; color: var(--mute); margin-top: 4px; }
  .bar { height: 8px; background: #efebe6; border-radius: 6px; margin-top: 12px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 6px; transition: width .6s; background: var(--y); }
  .bar.blue > i { background: var(--blue); } .bar.grey > i { background: #9aa3ab; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 50px; border-top: 1px solid #f3efea; }
  .row:first-of-type { border-top: 0; }
  .row .lbl { flex: 1; font-size: 16px; }
  .row .lbl small { display: block; font-size: 13px; color: var(--mute); margin-top: 2px; }
  .toggle { width: 52px; height: 32px; border-radius: 16px; background: #e3ded8; position: relative; border: 0; cursor: pointer; flex: none; transition: background .2s; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .2s; }
  .toggle.on { background: var(--y); } .toggle.on::after { left: 23px; }
  .row.tap { cursor: pointer; }
  .ctl-off { opacity: .38; pointer-events: none; transition: opacity .25s; }
  .ctl { transition: opacity .25s; }
  .seg { display: flex; background: var(--soft); border-radius: 14px; padding: 4px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: none; padding: 10px 6px; border-radius: 11px; font-size: 14.5px; color: var(--mute); cursor: pointer; }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .seg button .need { display: block; font-size: 11px; color: var(--mute); font-weight: 400; margin-top: 1px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: #ece7e1; border-radius: 4px; outline: none; }
  input[type=range]:disabled { opacity: .4; }
  input[type=range]:disabled::-webkit-slider-thumb { background: #cfc8c0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--y); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .dim { padding: 0 0 12px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--mute); }
  .i { display: inline-flex; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #c9c3bc; color: #8d877f; font-size: 11px; font-weight: 600; align-items: center; justify-content: center; font-style: normal; cursor: pointer; vertical-align: 2px; margin-left: 5px; }
  .quick { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .qbtn { border: 0; background: var(--soft); border-radius: 16px; padding: 13px 8px; font-size: 14px; cursor: pointer; color: var(--ink); line-height: 1.2; }
  .qbtn b { display: block; font-size: 12px; font-weight: 400; color: var(--mute); margin-top: 4px; }
  .qbtn.on { background: var(--y); } .qbtn.on b { color: var(--ink); opacity: .65; }
  .scenes { display: flex; flex-wrap: wrap; gap: 8px; }
  .scene { display: flex; align-items: center; background: var(--soft); border-radius: 14px; padding: 4px 4px 4px 14px; font-size: 15px; cursor: pointer; border: 2px solid transparent; }
  .scene.active { border-color: var(--y); background: var(--y-soft); }
  .scene .pen { border: 0; background: none; padding: 12px 12px; cursor: pointer; color: var(--mute); font-size: 13px; }
  .scene.add { border: 2px dashed #d8d1c8; background: none; padding: 12px 16px; font-weight: 600; color: #a87400; }
  .note { font-size: 13px; color: var(--mute); padding: 8px 0 2px; line-height: 1.4; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 10px; background: var(--soft); color: var(--mute); font-weight: 500; }
  .pill.heat { background: #fdebd9; color: #b45f12; } .pill.cool { background: #e2eefb; color: #2f6fb2; } .pill.ok { background: #e5f3ea; color: #2f7d4a; }
  .pill.plus { background: #e5f3ea; color: #2f7d4a; } .pill.minus { background: #fdebd9; color: #a3530e; }
  .bigbtns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .bigbtns button { border: 0; background: var(--soft); border-radius: 16px; padding: 16px 6px; font-size: 16px; cursor: pointer; }
  .bigbtns button.on { background: var(--y); font-weight: 600; }
  /* temperature ring */
  .ringwrap { display: flex; align-items: center; gap: 18px; }

  S.batt.kwh = Math.max(0, Math.min(S.batt.cap, S.batt.kwh + energy().net / 1000 / 60));
  const o = S.out; let moved = false;
  if (Math.abs(o.awning - o.target) > .001) { o.awning += Math.sign(o.target - o.awning) * Math.min(.1, Math.abs(o.target - o.awning)); moved = true; }
  chips();
  const busy = document.getElementById('modal').style.display === 'flex' || document.getElementById('pop').style.display === 'block' || (document.activeElement && document.activeElement.type === 'range');
  if (moved && !busy) { renderHero(); renderPhone(); }
  else if (tick % 3 === 0 && !busy) { renderPanel(); renderPhone(); if (S.tab === 'power' || S.tab === 'climate') renderHero(); if (heroView() === 'inside') { const chip = hero.querySelector('.climatechip'); if (chip) { const t = document.createElement('div'); t.innerHTML = heroInside(); const n = t.querySelector('.climatechip'); if (n) chip.replaceWith(n); } } }
}, 1000);
/* A phone gets the phone app full screen; anything wider gets tablet and phone side by side, sharing one state. */
/* One link, three ways to look at it. Both devices side by side only fit at real size on a big
   screen; anything smaller opens on the Garmin screen alone, and the switch at the top changes it. */
let VIEW = innerWidth >= 1700 && innerHeight >= 960 ? 'both' : 'garmin';
function setView(v) { VIEW = v; fit(); renderDemo(); }
function fit() {
  const phone = matchMedia('(max-width: 760px)').matches;
  document.body.classList.toggle('phonemode', phone);
  if (phone) return;
  ['garmin', 'phone', 'both'].forEach(v => document.body.classList.toggle('v-' + v, VIEW === v));
  document.querySelectorAll('#viewsw button').forEach(x => x.classList.toggle('on', x.dataset.v === VIEW));
  const W = { both: 1936, garmin: 1436, phone: 430 }[VIEW], H = 960;
  stage.style.width = W + 'px';
  const s = Math.min((innerWidth - 40) / W, (innerHeight - 76) / H, 1.15);
  stage.style.top = `calc(50% + 26px)`;
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit(); renderAll();
</script>
